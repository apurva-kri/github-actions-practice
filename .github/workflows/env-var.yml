name : environment variable

on:
    push:
        branches: [main]
env:
    APP_NAME: myapp
    ENVIRONMENT: staging
    VERSION: 1.0.0

jobs:
    environment:
     runs-on: ubuntu-latest
     steps:
        - name: print all level
          run: echo "$APP_NAME, $ENVIRONMENT, $VERSION"

        - name: Print github context
          run: |
            echo "Commit SHA: ${{ github.sha }}"
            echo Trigerred By: ${{ github.actor }}""
  
