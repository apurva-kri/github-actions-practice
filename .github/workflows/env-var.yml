name : environment variable

on:
    push:
        branches: [main]
env:
    APP_NAME: myapp
    ENVIRONMENT: staging
    VERSION: 1.0.0

jobs:
    environment:
     runs-on: ubuntu-latest
     steps:
        - name: print all level
          run: echo "$APP_NAME, $ENVIRONMENT, $VERSION"

        - name: Print github context
          run: |
            echo "Commit SHA: ${{ github.sha }}"
            echo Trigerred By: ${{ github.actor }}""

    get-date:   #job name
      runs-on: ubuntu-latest
      outputs:  # Expose values from this job so other jobs can use them
     # steps.date.outputs.today → Refers to the output named today created by the step whose id is date
        today: ${{ steps.date.outputs.today}}  # Create a job output named 'today' using the step output

      steps:
        - name: get todays date
          id: date # Unique ID for this step, used to reference its outputs
          # $GITHUB_OUTPUT → A special file that GitHub Actions uses to store step outputs.
          run: echo "today=$(date)" >> $GITHUB_OUTPUT  # Run the Linux 'date' command and save its result as a step output named 'today'

    print-date:       # Job 2: Reads and prints the output from Job 1
        runs-on: ubuntu-latest
        needs: get-date          # Wait for the 'get-date' job to finish before starting
        steps:
          - name: print date
           # Access the 'today' job output from the 'get-date' job and print it
            run: echo "Today date is ${{ needs.get-date.outputs.today}}"  
    
          - name: run only on main branch
            if: github.ref == 'refs/head/main'   #github.ref - stores the branch or tag that trigerred the workflow
            run: echo "This is the main branch"

          - name: run if previous steps fail
            if: failure()         # its a built-in GitHub Actions Function
            run: echo "previous step failed"

    build:
      if: github.event_name == 'push'  # contains the event that started the workflow
      runs-on: ubuntu-latest
      steps:
        - run: echo "running only on push"

        - name: continue on error
          continue-on-error: true
          run: exit 1

        - name: Next Step
          run: echo "workflow continues"
